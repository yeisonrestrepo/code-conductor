name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # OIDC trusted publishing needs npm >= 11.5.1. npm stays pinned to 11 rather than
      # floating to @latest so this job's npm moves only by a deliberate edit: npm 12's
      # engines (^22.22.2 || ^24.15.0 || >=26) would tie the job to whichever 24.x
      # setup-node resolves, and npm 11 accepts ^20.17.0 || >=22.9.0.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Node 24 is the most-covered runtime: it executes the node:sqlite suites that
      # Node 20 skips. The Node 20 floor is asserted by test.yml's matrix on the PR, and
      # again by its push-to-main run, which tests the exact commit a release tags. No
      # skip-baseline step here [BUG-048]: the baseline is a merge gate, every publishable
      # commit already passed both asserted legs, and this suite's own red remains the
      # publish gate.
      - run: npx vitest run
      - name: Verify package version matches the release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release tag ($TAG)"; exit 1
          fi
      - name: Guard against re-publishing an existing version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@yeison.restrepo.r/code-conductor@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::@yeison.restrepo.r/code-conductor@$PKG_VERSION already exists on the registry"; exit 1
          fi
      # Auth via OIDC trusted publishing (configured on npmjs.com) — no token needed.
      - run: npm publish --provenance --access public

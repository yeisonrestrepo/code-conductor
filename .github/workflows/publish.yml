name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # Two bounds, both load-bearing: OIDC trusted publishing needs npm >= 11.5.1,
      # and npm 12 dropped Node 20 entirely (engines ^22.22.2 || ^24.15.0 || >=26),
      # so an unpinned @latest fails this job with EBADENGINE. npm 11 accepts
      # ^20.17.0 || >=22.9.0. The runner stays on Node 20 to match engines.node's
      # floor, so the tarball is validated on the oldest Node the package supports.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npx vitest run
      - name: Verify package version matches the release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release tag ($TAG)"; exit 1
          fi
      - name: Guard against re-publishing an existing version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@yeison.restrepo.r/code-conductor@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::@yeison.restrepo.r/code-conductor@$PKG_VERSION already exists on the registry"; exit 1
          fi
      # Auth via OIDC trusted publishing (configured on npmjs.com) — no token needed.
      - run: npm publish --provenance --access public
